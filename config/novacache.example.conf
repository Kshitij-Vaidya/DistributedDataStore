# NovaCache configuration contract.
# Phase 0 documents these settings; parsing begins in a later phase.

[server]
bind = "127.0.0.1"
port = 6379
backlog = 128
workers = 0                    # 0 selects a hardware-based default
shards = 16
max_connections = 10000

[protocol]
max_connection_buffer_bytes = 16777216
max_bulk_string_bytes = 8388608
max_array_elements = 1024
max_nesting_depth = 32

[memory]
max_memory_bytes = 0          # 0 means unlimited
eviction_policy = "noeviction"

[expiry]
active_expiry_hz = 10

[persistence]
enabled = true
data_dir = "./data"
fsync = "everysec"            # always, everysec, or none
snapshot_interval_seconds = 300

[logging]
level = "info"                # trace, debug, info, warn, or error
destination = "stdout"

[replication]
role = "leader"               # leader or replica
leader_host = "127.0.0.1"
leader_port = 6379

[security]
requirepass = ""
